<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>飞八分钱大挑战</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&family=Noto+Sans+SC:wght@400;700;900&family=Chakra+Petch:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1c1410; --paper:#f6ecd7; --red:#d8442b; --deep:#a02c1c;
  --gold:#f0a63c; --gold2:#ffd168; --teal:#155e52; --cream:#fff7e6;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;touch-action:none;overscroll-behavior:none}
body{font-family:'Noto Sans SC',sans-serif;background:#16382f;color:var(--ink);user-select:none;cursor:crosshair}
.disp{font-family:'ZCOOL QingKe HuangYou','Noto Sans SC',sans-serif;font-weight:400}
.num{font-family:'Chakra Petch','Noto Sans SC',monospace}
button{font-family:inherit;cursor:pointer;border:none;background:none}
[hidden]{display:none!important}

canvas#c3d{position:fixed;inset:0;z-index:0}
canvas#fx{position:fixed;inset:0;z-index:10;pointer-events:none}
#vig{position:fixed;inset:0;z-index:5;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(20,10,5,.38) 100%)}
#flash{position:fixed;inset:0;z-index:35;pointer-events:none;opacity:0;background:var(--gold2)}

#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;
  align-items:flex-start;padding:10px 12px;gap:10px;flex-wrap:wrap;pointer-events:none}
.chip{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:6px 14px;clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
#stageChip .k{display:inline-block;background:var(--red);color:var(--cream);font-weight:900;font-size:11px;
  letter-spacing:.3em;padding:2px 8px;margin-right:8px;vertical-align:2px}
#stageChip .n{font-family:'ZCOOL QingKe HuangYou';font-size:22px;letter-spacing:.06em}
#timerBox{background:var(--ink);color:var(--gold2);border:3px solid var(--gold);padding:2px 16px 6px;text-align:center}
#timerBox small{display:block;font-size:10px;letter-spacing:.5em;color:var(--gold);font-weight:700}
#timer{font-family:'Chakra Petch';font-weight:700;font-size:38px;line-height:1}
#timerBox.low #timer{color:#ff5c3c;animation:blink .45s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
#scoreBox{background:var(--red);color:var(--cream);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
  padding:4px 16px 8px;text-align:right}
#scoreBox small{display:block;font-size:10px;letter-spacing:.5em;font-weight:900;color:var(--gold2)}
#score{font-family:'Chakra Petch';font-weight:700;font-size:34px;line-height:1}
#combo{position:fixed;top:86px;right:14px;z-index:20;font-family:'ZCOOL QingKe HuangYou';font-size:30px;
  color:var(--gold2);text-shadow:3px 3px 0 var(--ink);transform:rotate(3deg);pointer-events:none}
#combo.bump{animation:bump .22s cubic-bezier(.2,2,.4,1)}
@keyframes bump{0%{transform:rotate(3deg) scale(1.5)}100%{transform:rotate(3deg) scale(1)}}

#subbar{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;display:flex;flex-direction:column;
  align-items:center;gap:8px;pointer-events:none}
#hint{background:var(--ink);color:var(--cream);font-weight:700;font-size:13px;letter-spacing:.08em;
  padding:6px 18px;border-left:6px solid var(--gold);border-right:6px solid var(--gold)}
#gaugeWrap{display:flex;align-items:center;gap:10px;background:var(--paper);border:3px solid var(--ink);
  box-shadow:4px 4px 0 var(--ink);padding:6px 14px}
#gaugeWrap b{font-size:13px;letter-spacing:.2em}
#gauge{width:min(42vw,320px);height:16px;border:3px solid var(--ink);background:#fff}
#gaugeFill{height:100%;width:0%;background:repeating-linear-gradient(45deg,#fff 0 8px,#efe6cf 8px 16px);
  border-right:3px solid var(--ink);transition:width .12s}
#gaugeNum{font-family:'Chakra Petch';font-weight:700;font-size:16px}

#bubble{position:fixed;z-index:22;max-width:300px;background:var(--paper);border:3px solid var(--ink);
  box-shadow:5px 5px 0 rgba(28,20,16,.8);padding:10px 14px;font-weight:900;font-size:15px;line-height:1.5;
  pointer-events:none;animation:bslam .28s cubic-bezier(.2,1.8,.4,1)}
#bubble::after{content:'';position:absolute;left:26px;bottom:-14px;width:22px;height:14px;background:var(--paper);
  clip-path:polygon(0 0,100% 0,40% 100%);border-bottom:3px solid var(--ink)}
@keyframes bslam{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}

#banner{position:fixed;inset:0;z-index:30;display:grid;place-items:center;pointer-events:none}
.bCard{position:relative;background:var(--paper);border:5px solid var(--ink);padding:22px 56px 30px;
  box-shadow:12px 14px 0 rgba(28,20,16,.85);animation:slam .5s cubic-bezier(.18,1.5,.4,1) both;text-align:center}
.bCard::before{content:'';position:absolute;left:-5px;right:-5px;bottom:-25px;height:14px;
  background:conic-gradient(from -45deg at 50% 0,var(--red) 90deg,transparent 0) 0 0/26px 14px repeat-x}
.bKick{display:inline-block;background:var(--red);color:var(--cream);font-weight:900;font-size:13px;
  letter-spacing:.45em;padding:3px 12px 3px 18px;margin-bottom:6px}
.bTitle{font-family:'ZCOOL QingKe HuangYou';font-size:clamp(46px,9vw,88px);line-height:1.05;
  text-shadow:4px 4px 0 var(--gold)}
.bSub{margin-top:6px;font-weight:900;color:var(--deep);letter-spacing:.1em;font-size:14px}
@keyframes slam{0%{transform:scale(2.4) rotate(7deg);opacity:0}100%{transform:scale(1) rotate(-1.5deg);opacity:1}}

.pop{position:fixed;z-index:40;font-family:'ZCOOL QingKe HuangYou';font-size:24px;color:var(--gold2);
  text-shadow:2px 2px 0 var(--ink);pointer-events:none;white-space:nowrap;
  animation:rise .9s ease-out forwards;transform:translate(-50%,0)}
.pop.big{font-size:42px;color:#fff}
.pop.ha{font-size:38px;color:var(--cream)}
@keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0}
  15%{transform:translate(-50%,-12px) scale(1.2);opacity:1}
  100%{transform:translate(-50%,-80px) scale(1);opacity:0}}

#purityWrap{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);width:min(680px,94vw);z-index:25;pointer-events:none}
#purityTop{display:flex;justify-content:space-between;align-items:baseline;background:var(--red);color:var(--cream);
  border:3px solid var(--ink);border-bottom:none;padding:4px 12px;font-weight:900}
#purityTop b{letter-spacing:.3em;font-size:12px}
#purityVal{font-family:'Chakra Petch';font-weight:700;font-size:20px;color:var(--gold2)}
#rotBox{font-size:12px;letter-spacing:.15em}
#purityStrip{background:var(--ink);border:3px solid var(--gold);padding:8px 12px;max-height:24vh;overflow:auto;
  pointer-events:auto;word-break:break-all;line-height:1.2;font-family:'Chakra Petch'}
#purityStrip .base{color:var(--gold)}
#purityStrip .d9{color:#fff;text-shadow:0 0 6px rgba(255,255,255,.5)}

.btn{display:inline-block;font-family:'ZCOOL QingKe HuangYou';font-size:26px;letter-spacing:.15em;
  background:var(--red);color:var(--cream);border:4px solid var(--ink);padding:12px 38px;
  box-shadow:7px 7px 0 var(--ink);transition:transform .12s,box-shadow .12s;
  clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.btn:hover{transform:translate(-2px,-2px);box-shadow:10px 10px 0 var(--ink);background:#e8512f}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
#muteBtn{position:fixed;top:12px;right:12px;z-index:70;width:44px;height:44px;background:var(--paper);
  border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-family:'ZCOOL QingKe HuangYou';font-size:20px}
#muteBtn:hover{transform:translate(-1px,-1px)}
#muteBtn.off{background:#777;color:#ddd}
#skipBtn{position:fixed;right:16px;bottom:16px;z-index:45;background:var(--ink);color:var(--gold2);
  border:3px solid var(--gold);padding:8px 22px;font-weight:900;letter-spacing:.2em}
#skipBtn:hover{background:#33251a}

.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
  background:rgba(18,10,6,.42);overflow:auto;padding:20px}
.panel{position:relative;background:var(--paper);border:5px solid var(--ink);box-shadow:14px 16px 0 rgba(20,12,8,.75);
  max-height:92vh;overflow:auto}
.panel::before{content:'';position:absolute;left:0;right:0;top:0;height:12px;
  background:repeating-linear-gradient(90deg,var(--red) 0 22px,var(--gold) 22px 44px)}

#titleGrid{display:grid;grid-template-columns:auto auto;gap:clamp(20px,5vw,70px);align-items:center;
  width:min(1000px,94vw);padding:clamp(20px,4vh,44px)}
#tickets{display:flex;flex-direction:column;gap:12px}
.ticket{display:flex;align-items:center;gap:12px;background:var(--cream);border:3px solid var(--ink);
  box-shadow:5px 5px 0 var(--ink);padding:8px 16px;transition:transform .15s}
.ticket:nth-child(odd){transform:rotate(-1.6deg)}
.ticket:nth-child(even){transform:rotate(1.2deg) translateX(10px)}
.ticket:hover{transform:translateX(8px) rotate(0)}
.ticket .no{width:34px;height:34px;background:var(--red);color:var(--cream);display:grid;place-items:center;
  font-family:'ZCOOL QingKe HuangYou';font-size:20px;flex:none}
.ticket b{display:block;font-size:17px;letter-spacing:.1em}
.ticket i{display:block;font-style:normal;font-size:11px;color:#7a6a55;font-weight:700}
#titleRight{text-align:center}
#vTitle{writing-mode:vertical-rl;font-family:'ZCOOL QingKe HuangYou';font-size:clamp(52px,10vh,104px);
  letter-spacing:.12em;line-height:1.15;color:var(--cream);margin:0 auto;
  text-shadow:4px 4px 0 var(--ink),9px 9px 0 var(--red)}
#titleSub{margin:14px 0 20px;font-weight:900;color:var(--cream);letter-spacing:.2em;font-size:14px;
  text-shadow:2px 2px 0 var(--ink)}
#badge{position:absolute;top:8px;right:-14px;width:96px;height:96px;background:var(--red);color:var(--cream);
  display:grid;place-items:center;text-align:center;font-family:'ZCOOL QingKe HuangYou';font-size:17px;line-height:1.2;
  border:4px solid var(--ink);transform:rotate(9deg);animation:wob 3.4s ease-in-out infinite;z-index:2}
@keyframes wob{0%,100%{transform:rotate(5deg)}50%{transform:rotate(13deg)}}
#tinyNote{margin-top:14px;font-size:11px;color:var(--cream);letter-spacing:.1em;text-shadow:1px 1px 0 var(--ink)}

#resultPanel{width:min(720px,94vw);padding:34px clamp(18px,4vw,46px) 30px;text-align:center}
#resultPanel h2{font-family:'ZCOOL QingKe HuangYou';font-size:34px;letter-spacing:.2em;margin:6px 0 14px}
.rRow{display:grid;grid-template-columns:96px 1fr 70px;gap:10px;align-items:center;padding:8px 0;
  border-bottom:2px dashed #c9b791;opacity:0;transform:translateX(-30px);animation:rowIn .4s ease-out forwards}
@keyframes rowIn{to{opacity:1;transform:none}}
.rRow .nm{font-weight:900;text-align:left;font-size:15px}
.rRow .nm small{display:block;font-weight:700;color:#8a7a60;font-size:10px;letter-spacing:.05em}
.rBar{height:14px;border:3px solid var(--ink);background:#fff}
.rBar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--gold) 0 8px,var(--gold2) 8px 16px);
  transition:width .8s cubic-bezier(.2,1,.3,1)}
.rRow .sc{font-family:'Chakra Petch';font-weight:700;font-size:18px;text-align:right}
#totalWrap{margin:18px 0 4px}
#totalWrap small{display:block;font-weight:900;letter-spacing:.6em;color:var(--deep);font-size:12px}
#total{font-family:'Chakra Petch';font-weight:700;font-size:clamp(52px,10vw,84px);line-height:1;color:var(--ink)}
#rankLine{margin:14px 0 8px}
#rankSub{font-weight:900;color:var(--deep);letter-spacing:.15em;margin-bottom:16px;font-size:14px}
.stamp{display:inline-block;border:6px solid var(--red);color:var(--red);padding:8px 30px;
  font-family:'ZCOOL QingKe HuangYou';font-size:clamp(38px,7vw,58px);letter-spacing:.1em;background:rgba(216,68,43,.05);
  animation:stampIn .45s cubic-bezier(.2,1.9,.4,1) both;outline:3px solid var(--red);outline-offset:5px}
@keyframes stampIn{0%{transform:scale(3.2) rotate(6deg);opacity:0}100%{transform:scale(1) rotate(-5deg);opacity:1}}

@media (max-width:760px){
  #titleGrid{grid-template-columns:1fr;gap:24px;justify-items:center}
  #vTitle{font-size:clamp(44px,9vw,64px)}
  #timer{font-size:30px}#score{font-size:26px}
  .rRow{grid-template-columns:80px 1fr 60px}
}
</style>
</head>
<body oncontextmenu="return false">
<canvas id="c3d"></canvas>
<div id="vig"></div>
<canvas id="fx"></canvas>
<div id="flash"></div>

<div id="hud">
  <div class="chip" id="stageChip"><span class="k" id="chipK">序幕</span><span class="n" id="chipN">飞八分钱大挑战</span></div>
  <div id="timerBox" hidden><small id="timerLabel">剩余</small><span id="timer">45.0</span></div>
  <div id="scoreBox"><small>总分</small><span id="score" class="num">0</span></div>
</div>
<div id="combo" hidden>连进 ×3</div>

<div id="subbar">
  <div id="gaugeWrap" hidden><b id="gaugeLabel">白粥容量</b><div id="gauge"><div id="gaugeFill"></div></div><span id="gaugeNum" class="num">0/60</span></div>
  <div id="hint" hidden></div>
</div>

<div id="purityWrap" hidden>
  <div id="purityTop"><b>纯度</b><span id="purityVal" class="num">0.0%</span><span id="rotBox">已转 0 圈</span></div>
  <div id="purityStrip"></div>
</div>

<div id="bubble" hidden><span id="bubbleTxt"></span></div>
<div id="banner" hidden></div>
<div id="popups"></div>

<button id="skipBtn" hidden>跳过 ▸</button>
<button id="muteBtn" title="声音开关">声</button>

<div id="title" class="overlay">
  <div id="badge">全程约<br>五分钟</div>
  <div id="titleGrid">
    <div id="tickets">
      <div class="ticket"><span class="no">壹</span><span><b>飞八分钱</b><i>限时抛币入飞门，一枚 30 分</i></span></div>
      <div class="ticket"><span class="no">贰</span><span><b>干飞马</b><i>白粥火炮轰满60勺，灌满它就笑哈哈</i></span></div>
      <div class="ticket"><span class="no">叁</span><span><b>飞八分钟</b><i>把「时间」抛进门55个，越快惊坐起越高分</i></span></div>
      <div class="ticket"><span class="no">肆</span><span><b>把币洗</b><i>按住画圈洗币，纯度 99.999…% 见真章</i></span></div>
    </div>
    <div id="titleRight">
      <h1 id="vTitle">飞八分钱大挑战</h1>
      <p id="titleSub">飞马指定 · 四式连环 · 荒诞竞技</p>
      <button id="startBtn" class="btn">开始挑战</button>
      <p id="tinyNote">建议开启声音 · 飞马将亲自为你配音</p>
    </div>
  </div>
</div>

<div id="result" class="overlay" hidden>
  <div class="panel" id="resultPanel">
    <h2>最 终 结 算</h2>
    <div id="rRows"></div>
    <div id="totalWrap"><small>总分</small><div id="total">0</div></div>
    <div id="rankLine"></div>
    <div id="rankSub"></div>
    <button id="againBtn" class="btn">再顺一次</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ============================================================
   飞八分钱大挑战 v4（平衡：正常人得分率提升至 75~90%）
   手段：辅助瞄准、白粥减量、命中框放大、洗币曲线放缓、
   分数曲线下保底上调、满分基准重设。
   内部调参参考（请勿展示给玩家）：手速 7~15 次/秒，画圈 2~4 圈/秒。
============================================================ */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,k)=>a+(b-a)*k;
const rand=(a,b)=>a+Math.random()*(b-a);
const $=id=>document.getElementById(id);

const GATE_Z=-3;
const aimPlane=new THREE.Plane(new THREE.Vector3(0,0,1),-GATE_Z);

/* ================= 音频（Web Audio） ================= */
const A={ctx:null,on:true,started:false,nextT:0,beatPulse:0,washG:null};
A.init=function(){
  if(A.started)return;
  const C=window.AudioContext||window.webkitAudioContext; if(!C)return;
  A.ctx=new C();
  const comp=A.ctx.createDynamicsCompressor(); comp.connect(A.ctx.destination);
  A.master=A.ctx.createGain(); A.master.gain.value=.9; A.master.connect(comp);
  A.sfx=A.ctx.createGain(); A.sfx.connect(A.master);
  A.mus=A.ctx.createGain(); A.mus.gain.value=.45; A.mus.connect(A.master);
  const b=A.ctx.createBuffer(1,A.ctx.sampleRate,A.ctx.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; A.noise=b;
  const src=A.ctx.createBufferSource(); src.buffer=b; src.loop=true;
  const bp=A.ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1500; bp.Q.value=.9;
  A.washG=A.ctx.createGain(); A.washG.gain.value=0;
  src.connect(bp); bp.connect(A.washG); A.washG.connect(A.sfx); src.start();
  A.started=true; A.nextT=A.ctx.currentTime+.1;
};
function env(g,t0,p,d){g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(p,t0+.006);g.gain.exponentialRampToValueAtTime(.0001,t0+d);}
function osc(type,f0,f1,t0,dur,vol,dest){if(!A.started)return;const o=A.ctx.createOscillator(),g=A.ctx.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t0);if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
  env(g,t0,vol,dur);o.connect(g);g.connect(dest||A.sfx);o.start(t0);o.stop(t0+dur+.1);}
function noiseHit(t0,dur,vol,ft,f0,f1,q,dest){if(!A.started)return;const s=A.ctx.createBufferSource();s.buffer=A.noise;s.loop=true;
  const f=A.ctx.createBiquadFilter();f.type=ft||'lowpass';f.frequency.setValueAtTime(f0||800,t0);
  if(f1)f.frequency.exponentialRampToValueAtTime(f1,t0+dur);f.Q.value=q||1;
  const g=A.ctx.createGain();env(g,t0,vol,dur);s.connect(f);f.connect(g);g.connect(dest||A.sfx);s.start(t0);s.stop(t0+dur+.1);}
const S={
  now(){return A.started?A.ctx.currentTime:0},
  throw(){noiseHit(this.now(),.16,.1,'bandpass',700,2200,1.2)},
  coin(){const t=this.now(),f=rand(1500,1900);osc('triangle',f,f*.97,t,.32,.16);osc('triangle',f*2.7,f*2.6,t,.2,.07);},
  bonk(){const t=this.now();osc('triangle',160,60,t,.13,.3);noiseHit(t,.06,.12,'lowpass',500);},
  splat(){const t=this.now();noiseHit(t,.14,.22,'lowpass',900,240);osc('sine',300,140,t,.12,.12);},
  gulp(){const t=this.now();osc('sine',340,90,t,.18,.2);},
  pew(){const t=this.now();noiseHit(t,.08,.1,'bandpass',900,400,2);osc('square',520,260,t,.07,.05);},
  gong(){const t=this.now();osc('sine',155,null,t,1.8,.4);osc('sine',233,null,t,1.2,.15);osc('sine',92,null,t,2.2,.22);noiseHit(t,.05,.1,'highpass',3000);},
  laugh(){const t=this.now();[620,560,500,450,390,470].forEach((f,i)=>{osc('square',f,f*.85,t+i*.12,.1,.12);});},
  tick(){const t=this.now();osc('square',1300,null,t,.035,.09);noiseHit(t,.03,.06,'highpass',4000);},
  ding2(){const t=this.now();osc('triangle',660,null,t,.12,.14);osc('triangle',990,null,t+.09,.16,.14);},
  spin(){const t=this.now();osc('triangle',1200,1800,t,.08,.06);},
  stamp(){const t=this.now();osc('sine',120,40,t,.22,.5);noiseHit(t,.08,.2,'lowpass',600);},
  setWash(v){if(A.started)A.washG.gain.setTargetAtTime(clamp(v,0,.25),A.ctx.currentTime,.06);}
};
const MUS={step:0,bar:0,kick:[0,4,8,12],wood:[2,6,10,14],pluck:[0,7,10],notes:[220,196,246.9,164.8]};
A.musicTick=function(){
  if(!A.started||!A.on)return;
  const spb=60/118;
  while(A.nextT<A.ctx.currentTime+.16){
    const s=MUS.step,t=A.nextT;
    if(MUS.kick.includes(s)){osc('sine',150,45,t,.13,.5,A.mus);A.beatPulse=1;}
    if(MUS.wood.includes(s))noiseHit(t,.04,.09,'highpass',2600,null,1,A.mus);
    if(MUS.pluck.includes(s))osc('triangle',MUS.notes[MUS.bar%4],null,t,.2,.12,A.mus);
    A.nextT+=spb/4; MUS.step=(MUS.step+1)%16; if(MUS.step===0)MUS.bar++;
  }
};

function resetGrime(){
  const g=bigCoinG.grimeCtx;
  g.clearRect(0,0,512,512);
  for(let i=0;i<26;i++)addBlotch();
  bigCoinG.dirty=true;
}
function addBlotch(){
  const g=bigCoinG.grimeCtx,a=Math.random()*6.283,rr=Math.random()*190;
  const x=256+Math.cos(a)*rr,y=256+Math.sin(a)*rr;
  g.save();g.fillStyle=`rgba(74,52,24,${rand(.45,.8)})`;
  g.beginPath();g.ellipse(x,y,rand(10,36),rand(8,26),rand(0,3),0,6.283);g.fill();g.restore();
}
function brushErase(u,v){
  const c=bigCoinG.grimeCtx,x=u*512,y=v*512,r=36;
  c.save();c.globalCompositeOperation='destination-out';
  const gr=c.createRadialGradient(x,y,r*.2,x,y,r);
  gr.addColorStop(0,'rgba(0,0,0,1)');gr.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=gr;c.beginPath();c.arc(x,y,r,0,6.283);c.fill();c.restore();
}
function eraseAt(px,py){
  const s=S4.screen;if(!s||!s.Rpx)return;
  const u=.5+(px-s.cx)/(2*s.Rpx),v=.5+(py-s.cy)/(2*s.Rpx);
  brushErase(u,v);brushErase(1-u,1-v);
  bigCoinG.dirty=true;
}
function compositeCoin(){
  const g=bigCoinG.compCtx;
  g.clearRect(0,0,512,512);
  g.drawImage(bigCoinG.baseCnv,0,0);
  g.drawImage(bigCoinG.grimeCnv,0,0);
  const pur=purityNow();
  g.save();g.globalCompositeOperation='source-atop';
  g.fillStyle=`rgba(62,40,18,${clamp(1-(pur-20)/80,0,1)*.42})`;
  g.fillRect(0,0,512,512);g.restore();
  bigCoinG.tex.needsUpdate=true;bigCoinG.dirty=false;
}
function washMove(x,y){
  const s=S4.screen;if(!s||!s.Rpx)return;
  const dx=x-s.cx,dy=y-s.cy,r=Math.hypot(dx,dy);
  if(r>3.2*s.Rpx){S4.lastAng=null;return;}
  const ang=Math.atan2(dy,dx);
  if(S4.lastAng!==null){
    let d=ang-S4.lastAng;
    while(d>Math.PI)d-=6.283;while(d<-Math.PI)d+=6.283;
    if(Math.abs(d)<1.05){
      S4.units+=Math.abs(d)/6.283;S4.moveAcc+=Math.abs(d)*r;
      eraseAt(x,y);
    }
  }
  S4.lastAng=ang;
}

  sunRays.rotation.z+=rdt*.15;
  sun.scale.setScalar(1+A.beatPulse*.05);A.beatPulse=Math.max(0,A.beatPulse-rdt*4);
  clouds.forEach(c=>{c.g.position.x+=c.v*rdt;if(c.g.position.x>38)c.g.position.x=-38;if(c.g.position.x<-38)c.g.position.x=38;});

  if(mode==='s1'||mode==='s3'||mode==='title'){
    const sp=mode==='title'?.5:G.sp,amp=mode==='title'?2:G.amp;
    gate.position.x=Math.sin(tGame*sp)*amp;
    gate.rotation.y=Math.sin(tGame*sp*.7)*.06;
  }
  if(gatePane){gatePane.material.opacity=.1+gatePanePulse*.4;gatePanePulse=Math.max(0,gatePanePulse-rdt*3);}

  if(rainOn&&Math.random()<rdt*8){
    const r=rainArr.find(q=>!q.act);
    if(r){r.act=true;r.m.visible=true;r.m.position.set(rand(-12,12),rand(12,16),rand(-4,2));
      r.vy=rand(-4,-2.5);r.spin=rand(-3,3);}
  }
  rainArr.forEach(r=>{if(!r.act)return;
    r.m.position.y+=r.vy*dt*3;r.m.rotation.x+=r.spin*dt;r.m.rotation.z+=r.spin*dt*.7;
    if(r.m.position.y<0){r.act=false;r.m.visible=false;}});

  if(horse.g.visible){
    const fw=horse.laughing?16:10;
    horse.wings[0].rotation.z=Math.sin(tGame*fw)*.5+.15;
    horse.wings[1].rotation.z=-(Math.sin(tGame*fw)*.5+.15);
    if(horse.laughing>0){
      horse.laughing-=rdt;
      horse.g.rotation.z=Math.sin(tGame*18)*.12;
      horse.mouth.scale.y=1+Math.sin(tGame*20)*1.5;
    }else{horse.g.rotation.z*=.9;horse.mouth.scale.y+=(1-horse.mouth.scale.y)*.2;}
    if(mode==='title'){
      horse.g.position.set(Math.sin(tGame*.35)*9,7.5+Math.sin(tGame*.9)*.8,-15);
      horse.g.rotation.y=Math.sin(tGame*.35)*.4;
    }else if(mode==='s2'&&horse.bob){
      /* 躲闪移动：变向更慢、幅度更小，方便普通人命中 */
      S2.wt-=rdt;
      if(S2.wt<=0){S2.wt=rand(.8,1.3);S2.tx=rand(-4.2,4.2);S2.ty=rand(5,8.6);}
      horse.g.position.x+=(S2.tx-horse.g.position.x)*Math.min(1,rdt*2.2);
      horse.g.position.y+=(S2.ty-horse.g.position.y)*Math.min(1,rdt*2.2);
      horse.g.position.x+=Math.sin(tGame*3.1)*rdt*.9;
      horse.g.position.y+=Math.cos(tGame*2.6)*rdt*.7;
      horse.g.position.z=GATE_Z;
      horse.g.rotation.z=clamp((S2.tx-horse.g.position.x)*.15,-.3,.3);
    }else if(horse.bob){
      horse.g.position.y+=(6.5-horse.g.position.y)*rdt*2;
    }
  }

  if(mode==='s1'){S1.t-=rdt;setTimer(S1.t);if(S1.t<=0)endStage1();}
  if(mode==='s2'){
    S2.t+=rdt;setTimer(S2.t);
    if(S2.held)tryFire();
    const tilt=clamp((S2.ax-W/2)/W,-1,1)*.7;
    cannon.rotation.z+=(-tilt-cannon.rotation.z)*.25;
    cannon.flash.scale.setScalar(Math.max(.001,cannon.flash.scale.x-rdt*8));
    if(!S2.done&&S2.t>=75)endStage2(false);
  }
  if(mode==='s3'){
    S3.t+=rdt;setTimer(S3.t);
    if(!S3.done&&S3.t>=75){
      S3.done=true;stageScores[2]=Math.round(S3.count/S3.need*9000);addScore(stageScores[2]);startJolt();
    }
  }
  if(mode==='s4')updateWash(rdt);

  flying.forEach(f=>{
    if(!f.act)return;
    f.t+=dt/f.dur;
    const k=Math.min(1,f.t);
    f.m.position.lerpVectors(f.p0,f.p1,k);
    if(!f.falling)f.m.position.y+=Math.sin(Math.PI*k)*2.4;
    f.m.rotation.x+=dt*9;f.m.rotation.z+=dt*7;
    if(f.t>=1){
      if(f.falling){f.act=false;f.m.visible=false;}
      else if(mode==='s1'||mode==='s3')resolveThrow(f,f.p1.x,f.p1.y);
      else{f.act=false;f.m.visible=false;}
    }
  });
  pBlobs.forEach(b=>{
    if(!b.act)return;
    b.t+=dt/b.dur;const k=Math.min(1,b.t);
    b.m.position.lerpVectors(b.p0,b.p1,k);b.m.rotation.x+=dt*12;b.m.rotation.y+=dt*9;
    if(b.t>=1){
      b.act=false;b.m.visible=false;
      const hp=horse.g.position;
      if(mode==='s2'&&Math.abs(b.p1.x-hp.x)<2.6&&Math.abs(b.p1.y-hp.y)<2.3)porridgeHit();
      else{S.splat();spawnSplat(b.p1,0xfff9ec,4,2.5);}
    }
  });
  splats.forEach(s=>{
    if(!s.act)return;
    s.life-=rdt;if(s.life<=0){s.act=false;s.m.visible=false;return;}
    s.m.position.x+=s.vx*rdt;s.m.position.y+=s.vy*rdt;s.m.position.z+=s.vz*rdt;
    s.vy-=20*rdt;s.m.scale.setScalar(s.life/s.max);
  });

  if(mode==='s4'){
    const c=worldToScreen(bigCoinG.position);
    const e=worldToScreen(new THREE.Vector3(3.4,6.2,-2));
    S4.screen={cx:c.x,cy:c.y,Rpx:Math.abs(e.x-c.x)||1};
  }
  if(!ui.bubble.hidden){
    const hp=worldToScreen(new THREE.Vector3(horse.g.position.x,horse.g.position.y+2.6,horse.g.position.z));
    ui.bubble.style.left=clamp(hp.x-40,8,W-310)+'px';
    ui.bubble.style.top=clamp(hp.y-ui.bubble.offsetHeight-26,8,H-120)+'px';
  }

  camera.position.lerp(camTarget,1-Math.pow(.002,rdt));
  if(shakeAmp>0){
    camera.position.x+=rand(-1,1)*shakeAmp*.05;
    camera.position.y+=rand(-1,1)*shakeAmp*.05;
    shakeAmp=Math.max(0,shakeAmp-rdt*10);
  }
  camera.lookAt(camLook);

  dispScore+=(realScore-dispScore)*Math.min(1,rdt*8);
  if(Math.abs(realScore-dispScore)<1)dispScore=realScore;
  ui.score.textContent=Math.round(dispScore).toLocaleString();

  drawFx(rdt);
  renderer.render(scene,camera);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
